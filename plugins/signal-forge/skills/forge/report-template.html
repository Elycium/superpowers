<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Forge report</title>
<style>
:root{--bg:#121316;--surface:#1c1d22;--surface-2:#2a2c33;--outline:#45464f;--text:#e3e2e6;--text-2:#c6c7cf;--muted:#a9aab2;--primary:#ff8a4c;--on-primary:#3a1400;--primary-soft:rgba(255,138,76,.18);--primary-text:#ffb088;--you:#8cc8ff;--you-soft:rgba(140,200,255,.16);--error:#ffb4ab;--error-badge:#93000a;--on-error-badge:#ffdad6;--code-bg:#0d0e11;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#fbf8f6;--surface:#f1ece8;--surface-2:#e6e1dd;--outline:#c9c4c0;--text:#1d1b1a;--text-2:#3b3836;--muted:#5f5b58;--primary:#a6420f;--on-primary:#fff;--primary-soft:rgba(166,66,15,.12);--primary-text:#8a3509;--you:#1f5fa8;--you-soft:rgba(31,95,168,.12);--error:#ba1a1a;--error-badge:#ba1a1a;--on-error-badge:#fff;--code-bg:#fff;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Roboto Flex",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--primary-text)}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 96px}
header h1{margin:0;font-size:26px;line-height:1.25}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.frags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.frag{background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px}
.frag b{font-family:"JetBrains Mono",ui-monospace,monospace;margin-right:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--surface-2);margin:8px -16px 0;padding:0 12px;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{height:48px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--text-2);font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--primary-text);border-bottom-color:var(--primary);font-weight:600}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--outline);color:var(--text);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.badge.err{background:var(--error-badge);color:var(--on-error-badge)}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:13px;margin:14px 0}
.chip{display:inline-flex;padding:1px 8px;border-radius:999px;font:12px/20px "JetBrains Mono",ui-monospace,monospace;white-space:nowrap}
.chip.frag-c{background:var(--surface-2);color:var(--text-2)}
.chip.panel{background:var(--primary-soft);color:var(--primary-text)}
.chip.you{background:var(--you-soft);color:var(--you)}
.chip.cardref{background:transparent;border:1px solid var(--outline);color:var(--text-2)}
.md{overflow-wrap:anywhere}
.md h1{font-size:22px}.md h2{font-size:19px}.md h3{font-size:16px;color:var(--primary-text)}.md h4{font-size:15px}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.2em 0 .5em}
.md p,.md ul,.md ol{margin:.5em 0}.md li{margin:.25em 0}
.md code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:6px}
.md pre{background:var(--code-bg);border:1px solid var(--surface-2);border-radius:12px;padding:12px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px;margin:.6em 0}
.md th,.md td{border:1px solid var(--surface-2);padding:6px 10px;text-align:left;vertical-align:top}
.md blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--outline);color:var(--text-2)}
.md hr{border:0;border-top:1px solid var(--surface-2);margin:1.5em 0}
.card{background:var(--surface);border-radius:16px;padding:16px;margin:12px 0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-head h3{margin:0;font-size:16px}
.card-sub{color:var(--muted);font-size:13px;margin-top:2px}
.type{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;margin-right:6px}
.btn{height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--surface-2);color:var(--text);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary);font-weight:600}
.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
details summary{cursor:pointer;color:var(--primary-text);font-size:14px;margin-top:10px;min-height:32px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.filters button{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);background:none;color:var(--text-2);font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--primary-soft);border-color:transparent;color:var(--primary-text)}
.empty{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Signal Forge report</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="frags" id="frags"></div>
  <nav class="tabs" role="tablist" aria-label="Report sections" id="tabs"></nav>
  <div class="legend"><span class="chip frag-c">@FragA:P2</span> source fact <span class="chip panel">@panel 4–1</span> panel ruling <span class="chip you">@you</span> your decision <span class="chip cardref">A-procedure-…</span> card</div>
  <main id="panel" role="tabpanel"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="forge-data">/*FORGE_DATA*/</script>
<script>
(function () {
  "use strict";
  var data;
  try { data = JSON.parse(document.getElementById("forge-data").textContent); }
  catch (e) { document.getElementById("panel").innerHTML = '<p class="empty">This report has no data. Rebuild it with build_report.py.</p>'; return; }

  // ---------- tiny, safe Markdown renderer (escapes all HTML first) ----------
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var CARD_IDS = (data.cards || []).map(function (c) { return c.card_id; });
  function chips(html) {
    html = html.replace(/DECISION @panel\s*\(([^)<\n]*)\)/g, '<span class="chip panel">@panel $1</span>');
    html = html.replace(/DECISION @user/g, '<span class="chip you">@you</span>');
    html = html.replace(/(^|[^\w-])(@Frag[A-Z]{1,2}:[^\s,;)\]<]+)/g, '$1<span class="chip frag-c">$2</span>');
    return html;
  }
  function inline(s) {
    var parts = s.split(/(`[^`]*`)/g);
    return parts.map(function (p, i) {
      if (i % 2 === 1) {
        var t = p.slice(1, -1);
        if (/^(DECISION @|@Frag)/.test(t)) return chips(esc(t));
        if (CARD_IDS.indexOf(t) >= 0) return '<a class="chip cardref" href="#card-' + esc(t) + '">' + esc(t) + "</a>";
        return "<code>" + esc(t) + "</code>";
      }
      var h = esc(p);
      h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
      h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return chips(h);
    }).join("");
  }
  function md(src) {
    var lines = String(src || "").replace(/\r/g, "").split("\n"), out = [], i = 0;
    function isTableSep(l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l); }
    function cells(l) { return l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); }); }
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
      }
      var h = /^(#{1,6})\s+(.*)$/.exec(l);
      if (h) { var n = Math.min(h[1].length + 1, 4); out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">"); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
      if (/\|/.test(l) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = cells(l); i += 2; var rows = [];
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) rows.push(cells(lines[i++]));
        out.push("<table><thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
        continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
        var ordered = /^\s*\d/.test(l), items = [];
        while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          var m = /^\s*(?:[-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
          if (m) items.push(m[1]); else items[items.length - 1] += " " + lines[i].trim();
          i++;
        }
        out.push((ordered ? "<ol>" : "<ul>") + items.map(function (t) {
          var box = /^\[( |x|X)\]\s+(.*)$/.exec(t);
          return "<li>" + (box ? (box[1] === " " ? "☐ " : "☑ ") + inline(box[2]) : inline(t)) + "</li>";
        }).join("") + (ordered ? "</ol>" : "</ul>"));
        continue;
      }
      if (/^>\s?/.test(l)) {
        var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>"); continue;
      }
      if (!l.trim()) { i++; continue; }
      var p = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>\s?|\s*([-*+]|\d+[.)])\s+)/.test(lines[i]) && !(/\|/.test(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))) p.push(lines[i++]);
      out.push("<p>" + inline(p.join(" ")) + "</p>");
    }
    return '<div class="md">' + out.join("\n") + "</div>";
  }

  // ---------- page ----------
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; setTimeout(function () { el.style.display = "none"; }, 1800); }
  function copy(text) { navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, function () { toast("Copy failed"); }); }
  function download(name, text) { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" })); a.download = name; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000); }
  function count(s) { if (!s) return 0; var n = String(s).split("\n").filter(function (l) { return /^\s{0,1}([-*]|\d+\.)\s/.test(l); }).length; return n || (String(s).trim() ? 1 : 0); }

  document.title = (data.title || "Signal Forge") + " · Signal Forge";
  document.getElementById("title").textContent = data.title || "Signal Forge report";
  document.getElementById("meta").textContent = [data.date, (data.cards || []).length + " cards", data.models].filter(Boolean).join(" · ");
  document.getElementById("frags").innerHTML = (data.fragments || []).map(function (f) {
    return '<div class="frag"><b>' + esc(f.id) + "</b>" + esc(f.name) + (f.template ? ' <span class="type">' + esc(f.template) + "</span>" : "") + "</div>";
  }).join("");

  var decisions = (data.decisions || []);
  var directiveMd = (data.directive_md || "") + (decisions.length ? "\n\n## Your decisions\n\n" + decisions.map(function (d) {
    return "- " + d.question + ": " + (d.answer ? d.answer + " DECISION @user" : "skipped (left as a conflict)");
  }).join("\n") : "");

  var tabs = [
    { id: "spec", label: "Spec", render: function () { return md(data.result_md || "_The rebuild step has not run yet._"); } },
    { id: "conflicts", label: "Conflicts", n: count(data.conflicts_md), err: true, render: function () { return md(data.conflicts_md || "No surfaced conflicts."); } },
    { id: "gaps", label: "Gaps", n: count(data.gaps_md), render: function () { return md(data.gaps_md || "No gaps listed."); } },
    { id: "directive", label: "Directive", render: function () { return md(directiveMd || "_No directive._"); } },
    { id: "cards", label: "Cards", n: (data.cards || []).length, render: renderCards }
  ];

  var filter = "all";
  function renderCards() {
    var cards = data.cards || [];
    if (!cards.length) return '<p class="empty">No cards.</p>';
    var types = cards.map(function (c) { return c.card_type; }).filter(function (t, i, a) { return t && a.indexOf(t) === i; });
    var html = '<div class="filters" role="group" aria-label="Filter by card type"><button data-f="all" aria-pressed="' + (filter === "all") + '">All</button>' +
      types.map(function (t) { return '<button data-f="' + esc(t) + '" aria-pressed="' + (filter === t) + '">' + esc(t) + "</button>"; }).join("") +
      '</div><button class="btn primary" id="dl-all">Download all cards (.md)</button>';
    html += cards.filter(function (c) { return filter === "all" || c.card_type === filter; }).map(function (c) {
      var i = cards.indexOf(c);
      return '<section class="card" id="card-' + esc(c.card_id) + '"><div class="card-head"><div><h3>' + esc(c.title || c.card_id) + '</h3><div class="card-sub"><span class="type">' + esc(c.card_type || "card") + "</span>" + esc(c.card_id) + (c.version ? " · v" + esc(c.version) : "") + '</div></div><button class="btn" data-copy="' + i + '">Copy card</button></div>' +
        "<details><summary>Show card</summary>" + md(String(c.markdown || "").replace(/^---\n[\s\S]*?\n---\n/, "")) + "</details></section>";
    }).join("");
    return html;
  }

  var current = (location.hash || "").replace("#", "") || "spec";
  if (current.indexOf("card-") === 0) current = "cards";
  function show(id) {
    current = id;
    document.getElementById("tabs").innerHTML = tabs.map(function (t) {
      return '<button role="tab" aria-selected="' + (t.id === id) + '" data-tab="' + t.id + '">' + t.label + (t.n !== undefined ? ' <span class="badge' + (t.err && t.n ? " err" : "") + '">' + t.n + "</span>" : "") + "</button>";
    }).join("");
    var tab = tabs.filter(function (t) { return t.id === id; })[0] || tabs[0];
    document.getElementById("panel").innerHTML = tab.render();
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-f],[data-copy],#dl-all,a.chip.cardref");
    if (!t) return;
    if (t.dataset.tab) show(t.dataset.tab);
    else if (t.dataset.f) { filter = t.dataset.f; show("cards"); }
    else if (t.dataset.copy) copy(data.cards[+t.dataset.copy].markdown);
    else if (t.id === "dl-all") download((data.slug || "signal-forge") + "-cards.md", data.cards.map(function (c) { return c.markdown; }).join("\n\n<!-- next card -->\n\n"));
    else if (t.classList.contains("cardref")) {
      e.preventDefault(); filter = "all"; show("cards");
      var el = document.getElementById(t.getAttribute("href").slice(1));
      if (el) { el.querySelector("details").open = true; el.scrollIntoView({ behavior: "smooth" }); }
    }
  });
  show(current);
})();
</script>
</body>
</html>
